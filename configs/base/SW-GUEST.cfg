! Configuracao minima consolidada do laboratorio; nao e backup integral.
! Estado base validado antes da otimizacao proposta.
enable
configure terminal
hostname SW-GUEST
vlan 20
 name GUEST
 exit
spanning-tree mode rapid-pvst
spanning-tree vlan 20 priority 32768
interface GigabitEthernet0/0
 description TRUNK-CORE1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 20
 no shutdown
 exit
interface GigabitEthernet0/2
 description TRUNK-CORE2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 20
 no shutdown
 exit
interface GigabitEthernet0/1
 description CLIENTE-GUEST
 switchport mode access
 switchport access vlan 20
 no shutdown
 exit
end
copy running-config startup-config
