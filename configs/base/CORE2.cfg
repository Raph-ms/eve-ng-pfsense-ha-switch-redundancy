! Configuracao minima consolidada do laboratorio; nao e backup integral.
! Estado base validado antes da otimizacao proposta.
enable
configure terminal
hostname CORE2
vlan 10
 name VLAN10
 exit
vlan 20
 name VLAN20
 exit
vlan 30
 name VLAN30
 exit
spanning-tree mode rapid-pvst
spanning-tree vlan 1,10,20,30 root secondary
interface GigabitEthernet0/0
 description TRUNK-PFSENSE-SECONDARY
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 1,10,20,30
 no shutdown
 exit
interface GigabitEthernet1/3
 description TRUNK-CORE1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 1,10,20,30
 no shutdown
 exit
interface GigabitEthernet0/3
 description TRUNK-SW-CORP
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 10
 no shutdown
 exit
interface GigabitEthernet1/0
 description TRUNK-SW-GUEST
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 20
 no shutdown
 exit
end
copy running-config startup-config
